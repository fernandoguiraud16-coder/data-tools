# Publishes every mcp/*.json to the official MCP registry (registry.modelcontextprotocol.io)
# as io.github.fernandoguiraud16-coder/<actor>. Login uses this repo's GitHub OIDC identity: no secret needed.
# To update an entry, change the file and bump its "version" (the registry rejects a version it already has).
name: Publish MCP registry entries

on:
  push:
    branches: [main]
    paths: ['mcp/*.json']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish each entry
        run: |
          failed=0
          for f in mcp/*.json; do
            echo "::group::$f"
            if ./mcp-publisher publish "$f" 2>&1 | tee out.txt; then :;
            elif grep -qi "already exists\|cannot publish duplicate\|version.*exists" out.txt; then echo "unchanged: $f";
            else failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
